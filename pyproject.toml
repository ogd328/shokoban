[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shokoban"
version = "0.1.0"
description = "書庫番 - 打ち合わせの文字起こしを手元AIで伏せ、人が確かめた中身だけから進行メモを作る / Mask meeting transcripts locally, review them yourself, then turn only the reviewed text into progress notes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "streamlit>=1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shokoban"]

[tool.pytest.ini_options]
testpaths = ["tests"]
